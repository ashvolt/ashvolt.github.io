# Copy this file into any project repo as .github/workflows/notify-portfolio.yml
# to rebuild the portfolio site within minutes of every push (instead of waiting
# for the nightly refresh).
#
# Requires a repo secret PORTFOLIO_DISPATCH_TOKEN: a fine-grained PAT scoped to
# ashvolt/ashvolt.github.io with Contents: Read and write (repository_dispatch
# needs write access on the target repo).
name: Notify portfolio

on:
  push:
    branches: [main, master]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portfolio rebuild
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/ashvolt/ashvolt.github.io/dispatches \
            -d '{"event_type":"project-updated"}'
