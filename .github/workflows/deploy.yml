name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily rebuild (03:00 UTC) to refresh GitHub projects + Credly data
    - cron: "0 3 * * *"
  repository_dispatch:
    # Fired by project repos' notify-portfolio workflow on push (see docs/notify-portfolio.yml)
    types: [project-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch live GitHub + Credly data
        run: npm run fetch-data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT (Metadata: read-only, all repos) so private repos
          # appear as project cards. Optional — without it, public repos only.
          PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}

      - name: Refresh GitHub avatar
        run: curl -fsSL -o public/avatar.jpg "https://avatars.githubusercontent.com/u/25412937?v=4" || echo "avatar refresh failed — using committed copy"

      - name: Build static site
        run: npm run build && npm run postbuild

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
